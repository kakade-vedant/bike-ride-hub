<article
  class="bg-zinc-900/80 border border-zinc-800 rounded-xl p-5 shadow-lg flex flex-col justify-between hover:border-emerald-500/40 transition-colors"
>
  <div>
    <div class="flex items-start justify-between gap-3 mb-3">
      <h3 class="text-xl font-bold text-zinc-100 tracking-tight leading-snug">
        {{ ride.title }}
      </h3>
      <span
        [ngClass]="{
          'bg-emerald-950/70 text-emerald-400 border-emerald-800/80':
            ride.difficulty === 'Easy',
          'bg-amber-950/70 text-amber-400 border-amber-800/80':
            ride.difficulty === 'Moderate',
          'bg-rose-950/70 text-rose-400 border-rose-800/80':
            ride.difficulty === 'Hard',
        }"
        class="px-2.5 py-0.5 text-xs font-semibold rounded-full border shrink-0"
      >
        {{ ride.difficulty }}
      </span>
    </div>

    <div class="flex items-center gap-2 text-sm text-zinc-400 mb-4">
      <svg
        class="w-4 h-4 text-emerald-500"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M13 10V3L4 14h7v7l9-11h-7z"
        />
      </svg>
      <span class="font-medium text-zinc-200">{{ ride.distanceKm }} km</span>
    </div>

    <!-- Waypoints List -->
    <div class="mb-4">
      <p class="text-xs font-mono uppercase tracking-wider text-zinc-500 mb-2">
        Route Stops
      </p>
      <div class="flex flex-wrap items-center gap-1.5 text-xs text-zinc-300">
        @for (stop of ride.stops; track $index; let last = $last) {
          <span
            class="bg-zinc-800/90 px-2 py-1 rounded border border-zinc-700/60"
            >{{ stop }}</span
          >
          @if (!last) {
            <span class="text-zinc-600 font-bold">→</span>
          }
        }
      </div>
    </div>

    <!-- Notes -->
    <p
      class="text-sm text-zinc-400 bg-zinc-950/50 p-3 rounded-lg border border-zinc-800/60 mb-5 line-clamp-3"
    >
      {{ ride.notes }}
    </p>
  </div>

  <a
    [href]="ride.googleMapUrl"
    target="_blank"
    rel="noopener noreferrer"
    class="w-full inline-flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-zinc-950 font-semibold text-sm px-4 py-2.5 rounded-lg transition-colors shadow-sm"
  >
    <span>Open in Google Maps</span>
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"
      />
    </svg>
  </a>
</article>
